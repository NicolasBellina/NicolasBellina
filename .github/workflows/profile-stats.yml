name: Actualiser les statistiques du profil

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update_profile_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Générer les cartes depuis les données publiques GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/update_profile_stats.py
      - name: Publier les images mises à jour
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Actualise les statistiques publiques du profil'
          git push
